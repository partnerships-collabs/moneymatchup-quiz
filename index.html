<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What Credit Card Should You Get? | Money Matchup</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #E03A3A;
      --accent-dim: #c72f2f;
      --green: #1a9e1a;
      --dark: #ffffff;
      --dark2: #f8f8f8;
      --dark3: #f2f2f2;
      --card-bg: #ffffff;
      --border: rgba(0,0,0,0.07);
      --border-light: rgba(0,0,0,0.10);
      --text: #111111;
      --muted: rgba(0,0,0,0.45);
      --white: #111111;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #f5f5f5;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* Header */
    .header {
      width: 100%;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.10);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
    .header-name { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 1rem; color: var(--white); letter-spacing: -0.02em; }
    .header-tag { font-size: 0.72rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }

    .page { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
    .page-wide { max-width: 980px; margin: 0 auto; padding: 48px 20px 80px; }

    /* Hero */
    .hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 48px; gap: 24px; }
    .hero-photo { width: 108px; height: 108px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); box-shadow: 0 0 40px rgba(242,86,86,0.2); flex-shrink: 0; }
    .hero h1 { font-family: 'Inter Tight', sans-serif; font-weight: 900; font-size: 2.6rem; line-height: 1.05; letter-spacing: -0.04em; color: var(--white); margin-bottom: 14px; }
    .hero h1 span { color: var(--accent); }
    .hero p { font-size: 1rem; color: var(--muted); line-height: 1.65; max-width: 480px; margin: 0 auto; text-align: center; }
    

    /* Steps */
    .steps { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 32px; }
    .step-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--dark3); border: 2px solid var(--border-light); color: var(--muted); font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: 'Inter Tight', sans-serif; transition: all 0.25s ease; }
    .step-dot.active { background: var(--accent); border-color: var(--accent); color: #000; box-shadow: 0 0 16px rgba(242,86,86,0.4); }
    .step-dot.done { background: rgba(242,86,86,0.15); border-color: var(--accent); color: var(--accent); }
    .step-line { height: 2px; width: 32px; background: var(--border-light); transition: background 0.25s ease; }
    .step-line.done { background: var(--accent); }

    /* Quiz card */
    .quiz-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 20px; padding: 36px; overflow: hidden; }
    .q-slide { animation: slideIn 0.28s ease forwards; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
    .q-slide-back { animation: slideInBack 0.28s ease forwards; }
    @keyframes slideInBack { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    .q-number { font-size: 0.72rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
    .q-text { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 1.4rem; line-height: 1.25; color: var(--white); margin-bottom: 28px; letter-spacing: -0.025em; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option { display: flex; align-items: center; gap: 14px; padding: 15px 18px; background: var(--dark3); border: 1.5px solid var(--border-light); border-radius: 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s; user-select: none; }
    .option:hover { border-color: var(--accent); background: rgba(224,58,58,0.04); transform: translateY(-1px); }
    .option:active { transform: translateY(0); }
    .option.selected { border-color: var(--accent); background: var(--accent); }
    .option-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .option.selected .option-check { background: #000; border-color: #000; }
    .option.selected .option-check::after { content: ''; width: 9px; height: 6px; border-left: 2.5px solid var(--accent); border-bottom: 2.5px solid var(--accent); transform: rotate(-45deg) translateY(-1px); display: block; }
    .option-label { font-size: 0.96rem; color: var(--text); line-height: 1.5; font-weight: 400; }
    .option.selected .option-label { color: #000; font-weight: 600; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }
    .btn-back { background: none; border: 1.5px solid var(--border-light); color: var(--muted); padding: 12px 20px; border-radius: 10px; font-size: 0.88rem; font-family: 'Inter', sans-serif; font-weight: 500; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .btn-back:hover { border-color: var(--muted); color: var(--text); }
    .btn-next { background: var(--accent); border: none; color: #000; padding: 13px 30px; border-radius: 10px; font-size: 0.95rem; font-family: 'Inter Tight', sans-serif; font-weight: 800; cursor: pointer; letter-spacing: -0.01em; transition: background 0.15s, transform 0.1s, box-shadow 0.15s; }
    .btn-next:hover { background: #c72f2f; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(224,58,58,0.25); }
    .btn-next:active { transform: translateY(0); }
    .btn-next:disabled { background: var(--border-light); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }

    /* Result screen */
    .result-header { text-align: center; margin-bottom: 44px; }
    .result-logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2.5px solid var(--accent); margin-bottom: 20px; }
    .result-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(224,58,58,0.08); border: 1px solid rgba(242,86,86,0.35); color: var(--accent); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 14px; border-radius: 99px; margin-bottom: 16px; }
    .result-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .result-headline { font-family: 'Inter Tight', sans-serif; font-weight: 900; font-size: 2.2rem; line-height: 1.05; letter-spacing: -0.04em; color: var(--white); margin-bottom: 8px; }
    .result-subhead { font-size: 0.95rem; color: var(--accent); font-weight: 600; margin-bottom: 16px; }
    .result-intro { font-size: 0.97rem; color: var(--muted); line-height: 1.7; max-width: 640px; margin: 0 auto; }

    /* Card grid */
    .card-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 36px; }
    @media (min-width: 620px) { .card-grid { grid-template-columns: 1fr 1fr; } }

    .result-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; transition: border-color 0.2s; }
    .result-card:hover { border-color: rgba(242,86,86,0.4); }
    .rc-type { font-size: 0.7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
    .rc-name { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 1.2rem; line-height: 1.2; letter-spacing: -0.02em; color: var(--white); margin-bottom: 16px; }

    .our-take { background: rgba(224,58,58,0.04); border: 1px solid rgba(242,86,86,0.18); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; }
    .our-take-label { font-size: 0.68rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .our-take-label img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }
    .our-take p { font-size: 0.9rem; color: #444444; line-height: 1.65; }

    .rc-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; flex: 1; }
    .rc-list h4 { font-size: 0.68rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
    .rc-list ul { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .rc-list ul li { font-size: 0.82rem; color: var(--muted); line-height: 1.5; padding-left: 14px; position: relative; }
    .rc-list ul li::before { content: '+'; color: var(--accent); position: absolute; left: 0; font-weight: 800; font-size: 0.8rem; }
    .rc-list.notes ul li::before { content: '!'; color: rgba(255,200,80,0.85); }

    .btn-apply { display: block; width: 100%; background: var(--accent); border: none; color: #000; padding: 13px; border-radius: 10px; font-size: 0.92rem; font-family: 'Inter Tight', sans-serif; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; letter-spacing: -0.01em; transition: background 0.15s, transform 0.1s; margin-top: auto; }
    .btn-apply:hover { background: #c72f2f; transform: translateY(-1px); }

    .btn-restart { display: block; width: 100%; background: var(--dark3); border: 1.5px solid var(--border-light); color: var(--muted); padding: 14px; border-radius: 12px; font-size: 0.9rem; font-family: 'Inter', sans-serif; font-weight: 500; cursor: pointer; transition: border-color 0.15s, color 0.15s; text-align: center; }
    .btn-restart:hover { border-color: var(--muted); color: var(--text); }

    .trust-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .trust-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(224,58,58,0.07); border: 1px solid rgba(242,86,86,0.25); color: var(--accent); font-size: 0.78rem; font-weight: 600; padding: 5px 12px; border-radius: 99px; letter-spacing: 0.02em; }
    .trust-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    @media (min-width: 600px) { .trust-pills { justify-content: center; } }
    @media (max-width: 599px) { .trust-pills { justify-content: center; } }


    .progress-wrap {
      height: 4px;
      background: var(--border-light);
      border-radius: 99px;
      margin-bottom: 32px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.35s ease;
      min-width: 8%;
    }
    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .page, .page-wide { padding: 32px 16px 60px; }
      .hero h1 { font-size: 2rem; }
      .quiz-card { padding: 24px 18px; }
      .q-text { font-size: 1.2rem; }
      .result-headline { font-size: 1.7rem; }
      .step-line { width: 20px; }
      .rc-lists { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="header">
  <div>
    <div class="header-name">Money Matchup</div>
  </div>
</header>

<!-- QUIZ SCREEN -->
<div id="quiz-screen" class="page">
  <div class="hero">
    <div class="hero-copy">
      <h1>Find Your <span>Perfect</span> Credit Card</h1>
      <p>A few quick questions. No fluff. Find the right card for your financial situation.</p>
      <div class="trust-pills">
        <span class="trust-pill">No email required</span>
        <span class="trust-pill">No sign-up</span>
        <span class="trust-pill">Results in 60 seconds</span>
      </div>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>

  <div class="quiz-card">
    <div id="q-inner">
      <div class="q-number" id="q-number">Question 1</div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
    </div>
    <div class="nav">
      <button class="btn-back" id="btn-back" onclick="prevQ()">← Back</button>
    </div>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="result-screen" class="hidden page-wide">
  <div class="result-header">
    <div><div class="result-badge">Your Match</div></div>
    <div class="result-headline" id="res-headline"></div>
    <div class="result-subhead" id="res-subhead"></div>
    <p class="result-intro" id="res-intro"></p>
  </div>

  <div class="card-grid" id="res-cards"></div>

  <button class="btn-restart" onclick="restart()">Start over</button>
</div>

  let current = 0;
  let answers = {};
  let selected = null;
  let autoAdvanceTimer = null;

  function updateProgress() {
    const pct = Math.round((current / (questions.length - 1)) * 100);
    const fill = document.getElementById('progress-fill');
    if (fill) fill.style.width = Math.max(8, pct) + '%';
  }

  function render(dir) {
    const q = questions[current];
    selected = answers[q.id] || null;
    updateProgress();

    const inner = document.getElementById('q-inner');
    inner.className = dir === 'back' ? 'q-slide-back' : 'q-slide';
    void inner.offsetWidth;

    document.getElementById('q-text').textContent = q.text;

    const optionsEl = document.getElementById('q-options');
    optionsEl.innerHTML = '';
    q.options.forEach(opt => {
      const div = document.createElement('div');
      div.className = 'option' + (selected === opt.value ? ' selected' : '');
      div.innerHTML = `<div class="option-check"></div><div class="option-label">${opt.label}</div>`;
      div.addEventListener('click', () => selectOption(opt.value));
      optionsEl.appendChild(div);
    });

    const backBtn = document.getElementById('btn-back');
    if (backBtn) backBtn.style.visibility = current === 0 ? 'hidden' : 'visible';
  }

  function selectOption(value) {
    if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
    selected = value;
    answers[questions[current].id] = value;
    document.querySelectorAll('.option').forEach((el, i) => {
      el.classList.toggle('selected', questions[current].options[i].value === value);
    });
    autoAdvanceTimer = setTimeout(() => { autoAdvanceTimer = null; nextQ(); }, 380);
  }

  function nextQ() {
    if (!selected) return;
    answers[questions[current].id] = selected;
    const id = questions[current].id;

    // Business: skip payoff, jump to score
    if (id === 'cardtype' && selected === 'business') {
      current = questions.findIndex(q => q.id === 'score');
      render('forward'); return;
    }
    // Business: after score → done
    if (answers.cardtype === 'business' && id === 'score') {
      showResult(); return;
    }
    // Carry balance → always balance transfer
    if (id === 'payoff' && selected === 'carry') {
      showResult(); return;
    }
    // Poor or new to credit → always builder
    if (id === 'score' && (selected === 'poor' || selected === 'new')) {
      showResult(); return;
    }
    // Goal = build → builder
    if (id === 'goal' && selected === 'build') {
      showResult(); return;
    }

    if (current < questions.length - 1) {
      current++;
      render('forward');
    } else {
      showResult();
    }
  }

  function prevQ() {
    if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
    if (current > 0) {
      if (answers.cardtype === 'business' && questions[current].id === 'score') {
        current = questions.findIndex(q => q.id === 'cardtype');
      } else {
        current--;
      }
      render('back');
    }
  }

  function showResult() {
    const category = getCategory(answers);
    const page = resultPages[category];

    document.getElementById('res-headline').textContent = page.headline;
    document.getElementById('res-subhead').textContent = page.subhead;
    document.getElementById('res-intro').textContent = page.intro;

    const grid = document.getElementById('res-cards');
    grid.innerHTML = '';
    page.cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'result-card';
      el.innerHTML = `
        <div class="rc-type">${card.type}</div>
        <div class="rc-name">${card.name}</div>
        <div class="our-take">
          <div class="our-take-label">
            <img src="logo.png" alt="Money Matchup" />
            Our Take
          </div>
          <p>${card.take}</p>
        </div>
        <div class="rc-lists">
          <div class="rc-list">
            <h4>Why it fits</h4>
            <ul>${card.pros.map(p => `<li>${p}</li>`).join('')}</ul>
          </div>
          <div class="rc-list notes">
            <h4>Watch out for</h4>
            <ul>${card.notes.map(n => `<li>${n}</li>`).join('')}</ul>
          </div>
        </div>
        <a href="#" class="btn-apply">Apply Now</a>
      `;
      grid.appendChild(el);
    });

    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function restart() {
    if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
    current = 0;
    answers = {};
    selected = null;
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    render('forward');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  render('forward');
</script>
